start_mowing_for:
  name: Start mowing for a duration
  description: Start a supervised or automation-requested run without changing the saved manual duration.
  target:
    entity:
      domain: lawn_mower
      integration: gardena_mower_ble
  fields:
    duration_hours:
      name: Duration
      required: true
      selector:
        number:
          min: 0.5
          max: 24
          step: 0.5
          unit_of_measurement: h
          mode: box

delete_schedule:
  name: Delete schedule
  description: Remove one weekly mowing schedule task from the mower.
  fields:
    index:
      name: Schedule number
      description: The 1-based schedule number shown in the schedule attributes.
      required: true
      selector:
        number:
          min: 1
          max: 15
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Gardena mower BLE device is loaded.
      required: false
      selector:
        text: {}

clear_schedule:
  name: Clear schedule
  description: Remove all weekly mowing schedule tasks from the mower.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Gardena mower BLE device is loaded.
      required: false
      selector:
        text: {}

get_error_history:
  name: Get error history
  description: Read messages stored on the robot and return structured response data. No mowing or settings changes. Like the app, exposes up to 50 entries in device index order.
  fields:
    max_entries:
      name: Maximum entries
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    offset:
      name: Starting index
      description: Zero-based index. Use next_offset from the previous response for another page. The robot can rotate its log between calls.
      default: 0
      selector:
        number:
          min: 0
          max: 49
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Required only when multiple Gardena mower BLE devices are loaded.
      selector:
        text: {}

log_error_history:
  name: Log error history
  description: Read mower message history and write it to the Home Assistant log.
  fields:
    max_entries:
      name: Maximum entries
      description: Optional limit for the number of history entries to read.
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Gardena mower BLE device is loaded.
      required: false
      selector:
        text: {}

refresh_diagnostics:
  name: Refresh diagnostics
  description: Perform a one-shot mower refresh, including diagnostic telemetry.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Gardena mower BLE device is loaded.
      required: false
      selector:
        text: {}
